# Group related minor and patch version updates; review major updates separately.
# Security updates keep their independent, immediate PRs. No versions are ignored.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#groups
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      backend-tests:
        applies-to: version-updates
        patterns:
          - pytest*
          - responses
        update-types:
          - minor
          - patch
      data-processing:
        applies-to: version-updates
        patterns:
          - pandas
          - pyarrow
          - numpy
        update-types:
          - minor
          - patch
      backend-runtime:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      react:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - minor
          - patch
      frontend-tooling:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
        dependency-type: development
      frontend-runtime:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
        dependency-type: production
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
